<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Användarprofil | Target Tasty</title>
    <link rel="stylesheet" href="stilmall.css" />
</head>
<body class="profile-page">
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo"><a href="index.html">Target Tasty</a></div>
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="om_Oss.html">Om oss</a></li>
                <li><a href="vanliga_Frågor.html">Vanliga frågor</a></li>
                <li><a href="recept_Och_Måltidslösningar.html">Recept och måltidslösningar</a></li>
                <li><a href="recensioner.html">Recensioner</a></li>
                <li><a href="användarprofil.html">Användarprofil</a></li>
                <li><a class="nav-button" href="signIn.html">Sign in</a></li>
                <li><a class="nav-button" href="signUp.html">Sign up</a></li>
            </ul>
        </div>
    </nav>

    <main class="profile-wrapper">
        <section class="profile-card">
            <h1>Min profil</h1>
            <p id="welcomeText">Välkommen!</p>
        </section>

        <section class="profile-card">
            <h2>Kontouppgifter</h2>
            <form id="profileForm">
                <label for="fullName">Namn</label>
                <input id="fullName" type="text" required />

                <label for="email">E-post</label>
                <input id="email" type="email" required />

                <button type="submit" class="save-btn">Spara uppgifter</button>
            </form>
            <p id="saveMessage" class="small-message"></p>
        </section>

        <section class="profile-card">
            <h2>Inställningar</h2>
            <label class="setting-row">
                <input type="checkbox" id="newsletterSetting" />
                Prenumerera på nyhetsbrev
            </label>
            <label class="setting-row">
                <input type="checkbox" id="darkModeSetting" />
                Mörkt läge (sparas lokalt)
            </label>
            <button id="saveSettingsBtn" class="save-btn">Spara inställningar</button>
        </section>

        <section class="profile-card">
            <h2>Säkerhet</h2>
            <button id="logoutBtn" class="logout-btn">Logga ut</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Target Tasty</p>
    </footer>

    <script src="profile.js"></script>
</body>
</html>
