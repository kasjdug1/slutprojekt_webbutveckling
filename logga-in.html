<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in | Target Tasty</title>
    <link rel="stylesheet" href="css/stilmall.css">
</head>

<body class="signin-page">

<nav class="navbar">
    <div class="navdiv">
        <div class="logo"><a href="index.html">Target Tasty</a></div>

        <ul>
            <li><a href="index.html">Hem</a></li>
            <li><a href="om-oss.html">Om oss</a></li>
            <li><a href="vanliga-fragor.html">Vanliga frågor</a></li>
            <li><a href="recept-och-maltider.html">Recept och måltidslösningar</a></li>
            <li><a href="recensioner.html">Recensioner</a></li>
            <li><a href="kontakta-oss.html">Kontakta oss</a></li>
            <li><a href="sociala-medier.html">Sociala medier</a></li>
            <li><a href="anvandarprofil.html">Användarprofil</a></li>
            <li><a class="nav-button" href="logga-in.html">Logga in</a></li>
            <li><a class="nav-button" href="skapa-konto.html">Skapa konto</a></li>
        </ul>
    </div>
</nav>

<main class="login-page">
    <div class="login-container">

        <h1>Logga in</h1>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-post</label>
                <input type="email" id="email" name="email" placeholder="din@epost.se" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Lösenord</label>
                <input type="password" id="password" name="password" placeholder="Ditt lösenord" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Logga in</button>
        </form>

        <div class="extra-links">
            <p><a href="vanliga-fragor.html">Glömt lösenord?</a></p>
            <p>Inget konto? <a href="skapa-konto.html">Skapa konto</a></p>
        </div>

    </div>
</main>

<script src="js/inloggning.js"></script>

</body>
</html>
