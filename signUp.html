<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />

    <title>Sign up | Target Tasty</title>
    <link rel="stylesheet" href="stilmall.css" />
</head>
<body class="signup-page">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo"><a href="index.html">Target Tasty</a></div>
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="om_Oss.html">Om oss</a></li>
                <li><a href="vanliga_Frågor.html">Vanliga frågor</a></li>
                <li><a href="recept_Och_Måltidslösningar.html">Recept och måltidslösningar</a></li>
                <li><a href="recensioner.html">Recensioner</a></li>
                <li><a href="användarprofil.html">Användarprofil</a></li>
                <li><a class="nav-button" href="signIn.html">Sign in</a></li>
                <li><a class="nav-button" href="signUp.html">Sign up</a></li>
            </ul>
        </div>
    </nav>

    <!-- SIGN-UP  -->
    <div class="signup-page-content">
        <div class="signup-container">
            <h2>Create Account</h2>

            <form id="signupForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required />
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required />
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="extra-links">
                <p>Already have an account? <a href="signIn.html">Sign in</a></p>
            </div>
        </div>
    </div>
<script src="index.js"></script>

</body>

</html>
